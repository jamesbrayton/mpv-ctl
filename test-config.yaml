# Test configuration for mpv-controller
# This is for testing purposes only

mpv_instances:
  - id: test-mpv
    socket_path: /tmp/test-mpv.sock
    display_name: Test Player

server:
  rest_port: 8000
  grpc_port: 50051
  bind_address: "127.0.0.1"
  enable_swagger_ui: true

logging:
  log_level: DEBUG

socket:
  read_timeout: 1.0
  max_retries: 2
  backoff_multiplier: 0.3
  jitter: true
  availability_check_interval: 0  # Disable for testing
